<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <title>Pufferfin</title>
  <!-- Variante pour fond sombre : négatif du logo officiel (pufferfin-logo.svg), géométrie inchangée. -->
  <g transform="translate(150 150)">
    <!-- Piquants -->
    <g stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="0" y1="-80" x2="0" y2="-128" transform="rotate(0)"/>
      <line x1="0" y1="-80" x2="0" y2="-112" transform="rotate(15)"/>
      <line x1="0" y1="-80" x2="0" y2="-128" transform="rotate(30)"/>
      <line x1="0" y1="-80" x2="0" y2="-112" transform="rotate(45)"/>
      <line x1="0" y1="-80" x2="0" y2="-128" transform="rotate(60)"/>
      <line x1="0" y1="-80" x2="0" y2="-112" transform="rotate(75)"/>
      <line x1="0" y1="-80" x2="0" y2="-128" transform="rotate(90)"/>
      <line x1="0" y1="-80" x2="0" y2="-112" transform="rotate(105)"/>
      <line x1="0" y1="-80" x2="0" y2="-128" transform="rotate(120)"/>
      <line x1="0" y1="-80" x2="0" y2="-112" transform="rotate(135)"/>
      <line x1="0" y1="-80" x2="0" y2="-128" transform="rotate(150)"/>
      <line x1="0" y1="-80" x2="0" y2="-112" transform="rotate(165)"/>
      <line x1="0" y1="-80" x2="0" y2="-128" transform="rotate(180)"/>
      <line x1="0" y1="-80" x2="0" y2="-112" transform="rotate(195)"/>
      <line x1="0" y1="-80" x2="0" y2="-128" transform="rotate(210)"/>
      <line x1="0" y1="-80" x2="0" y2="-112" transform="rotate(225)"/>
      <line x1="0" y1="-80" x2="0" y2="-128" transform="rotate(240)"/>
      <line x1="0" y1="-80" x2="0" y2="-112" transform="rotate(255)"/>
      <line x1="0" y1="-80" x2="0" y2="-128" transform="rotate(270)"/>
      <line x1="0" y1="-80" x2="0" y2="-112" transform="rotate(285)"/>
      <line x1="0" y1="-80" x2="0" y2="-128" transform="rotate(300)"/>
      <line x1="0" y1="-80" x2="0" y2="-112" transform="rotate(315)"/>
      <line x1="0" y1="-80" x2="0" y2="-128" transform="rotate(330)"/>
      <line x1="0" y1="-80" x2="0" y2="-112" transform="rotate(345)"/>
    </g>
    <!-- Corps -->
    <circle r="86" fill="#fff"/>
    <!-- Oeil -->
    <circle cx="0" cy="-6" r="38" fill="#000"/>
    <circle cx="0" cy="-3" r="23" fill="#fff"/>
    <circle cx="7" cy="-13" r="6.5" fill="#000"/>
    <!-- Sourire -->
    <path d="M -22 54 Q 0 68 22 54" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
