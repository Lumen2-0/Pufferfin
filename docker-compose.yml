# Pufferfin on Dokploy (Compose type, source: this repo). Set these in the Dokploy environment:
#   GITHUB_TOKEN  read access to the private web repo (build time)
#   WEB_REF       web client branch/tag (optional, default deploy/dokploy)
services:
  pufferfin:
    build:
      context: .
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        WEB_REF: ${WEB_REF:-deploy/dokploy}
    container_name: pufferfin
    restart: unless-stopped
    expose:
      - "8096"
    volumes:
      - pufferfin-config:/config
      - pufferfin-cache:/cache
      - /srv/lumen/media:/media            # shared with Radarr / Sonarr / Bazarr
      - /srv/lumen/downloads:/downloads    # shared with qBittorrent
    environment:
      - JELLYFIN_PublishedServerUrl=${PUBLIC_URL:-}
      # The *arr stack: links and addresses, set in the Dokploy environment.
      - PUFFERFIN_STACK_DOMAIN=${PUFFERFIN_STACK_DOMAIN}
      - RADARR_URL=${RADARR_URL}
      - SONARR_URL=${SONARR_URL}
      - PROWLARR_URL=${PROWLARR_URL}
      - BAZARR_URL=${BAZARR_URL}
      - QBITTORRENT_URL=${QBITTORRENT_URL}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - MEDIA_PATH=${MEDIA_PATH}
      - DOWNLOADS_PATH=${DOWNLOADS_PATH}
      - QBITTORRENT_DOWNLOADS_PATH=${QBITTORRENT_DOWNLOADS_PATH}

volumes:
  pufferfin-config:
  pufferfin-cache:

