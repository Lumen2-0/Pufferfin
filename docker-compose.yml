# Pufferfin on Dokploy (Compose type, source: this repo). Set these in the Dokploy environment:
#   GITHUB_TOKEN  read access to the private web repo (build time)
#   WEB_REF       web client branch/tag (optional, default main)
#   MEDIA_PATH    host path of the media library (optional)
services:
  pufferfin:
    build:
      context: .
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        WEB_REF: ${WEB_REF:-main}
    container_name: pufferfin
    restart: unless-stopped
    expose:
      - "8096"
    volumes:
      - pufferfin-config:/config
      - pufferfin-cache:/cache
      - ${MEDIA_PATH:-./media}:/media
    environment:
      - JELLYFIN_PublishedServerUrl=${PUBLIC_URL:-}

volumes:
  pufferfin-config:
  pufferfin-cache:
